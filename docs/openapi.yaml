          example:
            error:
              code: unauthorized
              message: Unauthorized
              details: {}
    ValidationError:
      description: Request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: validation_error
              message: Request is invalid
              details:
