      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: conflict
              message: Conflict
              details: {}
    StudywellCourseDeleteConflict:
      description: |
        Stale `lock_version` (details `{}`) or the course still has
        obligations (`details.obligations_count` is an integer).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: conflict
              message: Conflict
              details:
                obligations_count: 2
    IntegrationNotConnected:
      description: Google is not connected for this caller (HTTP 409).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: integration_not_connected
              message: Google is not connected
              details: {}
    ProviderError:
      description: Upstream provider request failed. Provider text is not echoed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: provider_error
              message: Provider request failed
              details: {}
    IntegrationUnavailable:
      description: The integration is not configured on this host.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: integration_unavailable
              message: Integration is unavailable
              details: {}
    InternalError:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: internal_error
              message: Request failed
              details: {}
    TooManyRequests:
      description: IP throttle on a public credential endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: too_many_requests
              message: Too many requests
              details: {}
    OriginNotAllowed:
      description: Origin is not the request host and is not an allowlisted HTTPS sibling.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: origin_not_allowed
              message: Origin is not allowed
              details: {}
